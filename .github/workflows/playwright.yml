name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'STG'
        type: choice
        options:
          - STG
          - DEV
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
          node-version: 24
          cache: npm
          
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install chromium

    - name: Run Playwright tests
      env:
        ENV: ${{ github.event.inputs.environment || 'STG' }}
        STG_USERNAME: ${{ secrets.STG_USERNAME }}
        STG_PASSWORD: ${{ secrets.STG_PASSWORD }}
      run: npx playwright test
      continue-on-error: true

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload JUnit Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: junit-results
        path: test-results/junit.xml
        retention-days: 30

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30

    - name: Publish Test Results to Summary
      uses: dorny/test-reporter@v1
      if: ${{ !cancelled() }}
      with:
        name: Playwright Test Results
        path: test-results/junit.xml
        reporter: java-junit
        fail-on-error: false
        list-suites: all
        list-tests: all

    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        npm run allure:generate
        echo "Allure report generated at ./allure-report"

    - name: Upload Allure Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Generate Test Summary
      if: ${{ !cancelled() }}
      shell: pwsh
      run: .\.github\workflows\generate-summary.ps1

    - name: Fail workflow if tests failed
      if: ${{ failure() }}
      run: exit 1
