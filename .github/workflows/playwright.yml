name: Playwright Tests
on:

  schedule:
    # Runs at 09:00 UTC every day
    - cron: '0 9 * * *'

  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 23
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install chromium
    - name: Run Playwright tests
      env:
        ENV: STG
        STG_USERNAME: ${{ secrets.STG_USERNAME }}
        STG_PASSWORD: ${{ secrets.STG_PASSWORD }}
      run: npx playwright test
    - name: Generate Test Summary
      if: ${{ !cancelled() }}
      run: node scripts/generate-summary.js
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30
