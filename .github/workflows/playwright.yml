name: Playwright Tests
on:

  schedule:
    # Runs at 9:15 AM Philippine Time (01:15 UTC) every day
    - cron: '15 1 * * *'

  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      env:
        ENV: STG
        STG_USERNAME: ${{ secrets.STG_USERNAME }}
        STG_PASSWORD: ${{ secrets.STG_PASSWORD }}
        STG_LOCKOUT_USERNAME: ${{ secrets.STG_LOCKOUT_USERNAME }}
        STG_LOCKOUT_PASSWORD: ${{ secrets.STG_LOCKOUT_PASSWORD }}
      run: npx playwright test
    - name: Generate Test Summary
      if: ${{ !cancelled() }}
      run: node scripts/generate-summary.js
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30
